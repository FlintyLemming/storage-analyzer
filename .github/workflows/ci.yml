name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Vet
        run: |
          go vet ./...
          go vet -tags qnap ./...
          go vet -tags fnos ./...
      - name: Test
        run: |
          go test ./...
          go test -tags qnap ./...
          go test -tags fnos ./...
      - uses: docker/setup-qemu-action@v3
      - name: Test on Linux architectures
        run: |
          ./scripts/test-linux.sh
          TAGS=qnap ./scripts/test-linux.sh
          TAGS=fnos ./scripts/test-linux.sh amd64 arm64
