# StorageAnalyzer QPKG configuration (QDK)
QPKG_NAME="StorageAnalyzer"
QPKG_DISPLAY_NAME="存储分析器"
QPKG_VER="0.4.0"
QPKG_AUTHOR="FlintyLemming"
QPKG_SUMMARY="类似 ncdu 的存储空间分析工具：定时或手动扫描所有存储池上的数据卷，逐层查看空间占用，保留历史扫描结果。"
QPKG_LICENSE="MIT"
QPKG_RC_NUM="101"
QPKG_SERVICE_PROGRAM="StorageAnalyzer.sh"
QPKG_WEBUI="/cgi-bin/qpkg/StorageAnalyzer/"
QPKG_WEB_PORT="-1"
QPKG_DESKTOP_APP="1"
# Main-menu visibility: QTS treats a missing Visible as 0 (only the account named "admin"),
# which hides the icon from every other administrator. 1 = administrators group.
QPKG_VISIBLE="1"
QPKG_DESKTOP_APP_WIN_WIDTH="1100"
QPKG_DESKTOP_APP_WIN_HEIGHT="680"
QTS_MINI_VERSION="5.0.0"
QDK_DATA_DIR_ICONS="icons"
